<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家計簿入力</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="theme-color" content="#f5f5f3">
<script>
// テーマを描画前に適用（ダーク時に一瞬白くなるのを防ぐ）
// 保存キーは記録データと分離 → データを消してもテーマ設定は残る
var THEME_KEY = 'kakeiboTheme';
// 表示モードの設定値は 'system' / 'light' / 'dark' の3状態。
// 未保存・不正値はすべて 'system'（端末の設定に連動）として扱う
function themePref() {
  var v = null;
  try { v = localStorage.getItem(THEME_KEY); } catch (e) {}
  return (v === 'dark' || v === 'light') ? v : 'system';
}
function systemPrefersDark() {
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
(function () {
  var pref = themePref();
  if (pref === 'dark' || (pref === 'system' && systemPrefersDark()))
    document.documentElement.setAttribute('data-theme', 'dark');
})();
</script>
<style>
  /* ── ライト（既定） ── */
  :root {
    --blue: #4a7ba6;
    --blue-light: #e6f1fb;
    --text: #1c1c1c;
    --text-muted: #6b6b6b;
    --border: #dcdcdc;
    --bg: #f5f5f3;
    --surface: #ffffff;
    --input-bg: #fafafa;
    --band: #f0f4f8;
    --danger: #c0392b;
    --on-blue: #ffffff;
  }

  /* ── ダーク ── */
  :root[data-theme="dark"] {
    --blue: #7fb0dc;
    --blue-light: #22364a;
    --text: #f2f3f5;
    --text-muted: #a8b0ba;
    --border: #3c434c;
    --bg: #14181d;
    --surface: #1f242b;
    --input-bg: #262c34;
    --band: #2a323b;
    --danger: #f08a80;
    --on-blue: #10161c;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 2rem;
  }
  header {
    position: relative;
    padding: 1rem 1.25rem 0.5rem;
    text-align: center;
  }
  header h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
  }
  .theme-btn {
    position: absolute;
    top: 0.7rem;
    right: 0.9rem;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: none;
    color: var(--text);
    font-size: 20px;
    line-height: 1;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.12s;
  }
  .theme-btn:active { opacity: 0.5; }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 0.5rem 1rem 1.5rem;
  }
  .card {
    background: var(--surface);
    border-radius: 14px;
    border: 1px solid var(--border);
    padding: 1.1rem 1rem;
    margin-bottom: 1rem;
  }
  .field-label {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
    display: block;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }
  .row:last-child { margin-bottom: 0; }
  input[type="date"], input[type="number"], input[type="text"] {
    font-size: 16px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--input-bg);
    width: 100%;
  }
  .amount-wrap {
    text-align: center;
    margin-bottom: 1.1rem;
  }
  .amount-wrap input {
    font-size: 34px;
    font-weight: 600;
    text-align: center;
    border: none;
    background: transparent;
    width: 100%;
    padding: 0;
  }
  .amount-wrap input:focus { outline: none; }
  .cat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 1.1rem;
  }
  .ico {
    margin-right: 6px;
    font-size: 1.1em;
    line-height: 1;
  }
  .cat-btn {
    font-size: 16px;
    padding: 13px 4px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    white-space: nowrap;
  }
  .cat-btn.selected {
    background: var(--blue-light);
    border-color: var(--blue);
    color: var(--blue);
    font-weight: 600;
  }
  .item-wrap { margin-bottom: 1.2rem; }
  .submit-btn {
    width: 100%;
    height: 56px;
    border: none;
    border-radius: 10px;
    background: var(--blue);
    color: var(--on-blue);
    font-size: 19px;
    font-weight: 600;
  }
  .submit-btn:active { opacity: 0.85; }
  .list-title {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .list-title span:first-child { font-size: 14px; font-weight: 600; }
  .list-title span:last-child { font-size: 13px; color: var(--text-muted); }
  .range-line {
    font-size: 12px;
    color: var(--text-muted);
    margin: -4px 0 10px;
  }
  .pill-row {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .pill {
    font-size: 15px;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--input-bg);
    color: var(--text-muted);
  }
  .pill .ico { margin-right: 4px; }
  .pill.selected {
    background: var(--blue-light);
    border-color: var(--blue);
    color: var(--blue);
    font-weight: 600;
  }
  .entry {
    display: flex;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    gap: 8px;
  }
  .entry:last-child { border-bottom: none; }
  .entry .cat {
    font-size: 11px;
    color: var(--blue);
    background: var(--blue-light);
    border-radius: 6px;
    padding: 2px 6px;
    white-space: nowrap;
  }
  .entry .item { flex: 1; color: var(--text); }
  .entry .price { font-weight: 600; white-space: nowrap; }
  .entry .del {
    background: none;
    border: none;
    font-size: 18px;
    padding: 2px 4px;
    line-height: 1;
  }
  .entry.exported { opacity: 0.45; }
  .date-group { margin-bottom: 14px; }
  .date-group:last-child { margin-bottom: 0; }
  .date-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    background: var(--band);
    border-radius: 6px;
    padding: 5px 8px;
    margin-bottom: 2px;
  }
  .date-head span:first-child { font-size: 13px; font-weight: 600; }
  .date-head span:last-child { font-size: 12px; color: var(--text-muted); }
  .empty-hint {
    color: var(--text-muted);
    font-size: 13px;
    text-align: center;
    padding: 1rem 0;
  }
  .archive-btn {
    width: 100%;
    height: 56px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--blue);
    color: var(--blue);
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 1.1rem;
  }
  .add-row input { flex: 1; }
  .add-btn {
    padding: 0 16px;
    height: 42px;
    border: none;
    border-radius: 8px;
    background: var(--blue);
    color: var(--on-blue);
    font-size: 16px;
    font-weight: 600;
    white-space: nowrap;
  }
  .shop-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    font-size: 17px;
  }
  .shop-item:last-child { border-bottom: none; }
  .check {
    width: 30px;
    height: 30px;
    flex: 0 0 auto;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--surface);
    color: transparent;
    font-size: 16px;
    font-weight: 700;
    line-height: 1;
  }
  .shop-text { flex: 1; }
  .shop-item.done .check {
    background: var(--blue);
    border-color: var(--blue);
    color: var(--on-blue);
  }
  .shop-item.done .shop-text {
    text-decoration: line-through;
    color: var(--text-muted);
  }
  .export-btn {
    width: 100%;
    height: 56px;
    border-radius: 10px;
    background: var(--blue);
    border: 1px solid var(--blue);
    color: var(--on-blue);
    font-size: 17px;
    font-weight: 600;
  }
  .export-btn:disabled {
    opacity: 0.4;
  }
  .export-note {
    font-size: 13px;
    color: var(--text-muted);
    margin: 0 0 10px;
    line-height: 1.5;
  }
  .danger-btn {
    width: 100%;
    height: 46px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--danger);
    color: var(--danger);
    font-size: 15px;
    margin-top: 12px;
  }
  .view-head {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 0.75rem;
  }
  .back-btn {
    background: none;
    border: none;
    color: var(--blue);
    font-size: 17px;
    font-weight: 600;
    padding: 6px 2px;
  }
  .view-head .view-title {
    font-size: 15px;
    font-weight: 600;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--on-blue);
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1 id="page-title">家計簿を記録</h1>
  <button class="theme-btn" id="theme-btn" aria-label="画面表示モード切替" title="画面表示モード切替">🌗</button>
</header>

<main>
  <div id="main-view">
    <div class="card">
      <div class="row">
        <span class="field-label" style="margin:0;">日付</span>
        <input type="date" id="date-input" style="width:auto;">
      </div>

      <div class="amount-wrap">
        <span class="field-label">金額</span>
        <input type="number" id="amount-input" inputmode="numeric" placeholder="0" min="0">
      </div>

      <span class="field-label">区分</span>
      <div class="cat-grid" id="cat-grid"></div>

      <div class="item-wrap">
        <span class="field-label">品名</span>
        <input type="text" id="item-input" placeholder="スーパーで買い物">
      </div>

      <button class="submit-btn" id="submit-btn"><span class="ico">✏️</span>記録する</button>
    </div>

    <div class="card">
      <div class="list-title">
        <span>今日入力した記録</span>
        <span id="today-total"></span>
      </div>
      <div id="today-list"></div>
    </div>

    <button class="archive-btn" id="open-shopping-btn"></button>
    <button class="archive-btn" id="open-archive-btn"></button>
  </div>

  <div id="shopping-view" hidden>
    <div class="view-head">
      <button class="back-btn" id="shop-back-btn"><span class="ico">←</span>記録にもどる</button>
    </div>

    <div class="card">
      <div class="add-row">
        <input type="text" id="shop-input" placeholder="牛乳" autocomplete="off">
        <button class="add-btn" id="shop-add-btn"><span class="ico">＋</span>追加</button>
      </div>

      <div class="list-title">
        <span>買うもの</span>
        <span id="shop-count"></span>
      </div>

      <div id="shop-list"></div>

      <button class="danger-btn" id="shop-clear-btn" hidden><span class="ico">🗑</span>買ったものを消す</button>
    </div>
  </div>

  <div id="archive-view" hidden>
    <div class="view-head">
      <button class="back-btn" id="back-btn"><span class="ico">←</span>記録にもどる</button>
    </div>

    <div class="card">
      <div class="pill-row" id="filter-row">
        <button type="button" class="pill selected" data-filter="pending"><span class="ico">📮</span>未送信</button>
        <button type="button" class="pill" data-filter="sent"><span class="ico">✅</span>送信済み</button>
      </div>

      <div class="list-title">
        <span id="archive-subtitle">未送信の記録</span>
        <span id="archive-total"></span>
      </div>
      <div class="range-line" id="archive-range"></div>

      <div class="pill-row" id="sort-row">
        <button type="button" class="pill selected" data-mode="date"><span class="ico">📅</span>日付順</button>
        <button type="button" class="pill" data-mode="recorded"><span class="ico">🕐</span>記録順</button>
      </div>

      <div id="archive-list"></div>

      <button class="danger-btn" id="clear-sent-btn" hidden><span class="ico">🗑</span>送信済みをすべて削除</button>
    </div>

    <div class="card">
      <p class="export-note" id="export-note"></p>
      <button class="export-btn" id="export-btn" disabled>まとめて書き出す</button>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const CATEGORIES = [
  "食費", "住居・備品", "水道・光熱", "衣料", "交際費",
  "レジャー", "教育", "医療・衛生", "その他1", "その他2"
];

// 表示用のアイコン（書き出すデータの区分名には影響しません）
const CATEGORY_ICONS = {
  "食費": "🛒",
  "住居・備品": "🏠",
  "水道・光熱": "💡",
  "衣料": "👕",
  "交際費": "🎁",
  "レジャー": "🎡",
  "教育": "📚",
  "医療・衛生": "💊",
  "その他1": "📦",
  "その他2": "🧾"
};
const WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];

const STORAGE_KEY = "kakeibo_entries_v1";
const SHOPPING_KEY = "kakeibo_shopping_v1";
let selectedCategory = null;
let sortMode = "date";
let archiveFilter = "pending";

function todayStr() {
  const d = new Date();
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}

function dateStrFromTs(ts) {
  const d = new Date(ts);
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}

function isRecordedToday(entry) {
  return dateStrFromTs(entry.id) === todayStr();
}

function fmtDateLabel(dateStr, markToday) {
  const [y, m, d] = dateStr.split("-").map(Number);
  const wd = WEEKDAYS[new Date(y, m - 1, d).getDay()];
  const suffix = markToday && dateStr === todayStr() ? "・今日" : "";
  return `${m}月${d}日(${wd})${suffix}`;
}

function loadEntries() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch (e) {
    return [];
  }
}

function saveEntries(entries) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

function fmtYen(n) {
  return "¥" + Math.round(n).toLocaleString("ja-JP");
}

// 同じミリ秒に続けて追加してもIDが重ならないようにする
function nextId(existing) {
  const used = new Set(existing);
  let id = Date.now();
  while (used.has(id)) id++;
  return id;
}

function sumOf(entries) {
  return entries.reduce((s, e) => s + e.price, 0);
}

function renderCategories() {
  const grid = document.getElementById("cat-grid");
  grid.innerHTML = "";
  CATEGORIES.forEach(cat => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "cat-btn";
    btn.innerHTML = `<span class="ico">${CATEGORY_ICONS[cat] || "📦"}</span>${cat}`;
    btn.dataset.cat = cat;
    btn.addEventListener("click", () => {
      selectedCategory = cat;
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
    });
    grid.appendChild(btn);
  });
}

function entryRowHtml(e) {
  return `
    <span class="cat">${e.category}</span>
    <span class="item">${e.item || ""} <span style="color:var(--text-muted)">${e.date.slice(5)}</span></span>
    <span class="price">${fmtYen(e.price)}</span>
    <button class="del" data-id="${e.id}" aria-label="削除">🗑</button>
  `;
}

function makeEntryEl(e) {
  const row = document.createElement("div");
  row.className = "entry" + (e.exported ? " exported" : "");
  row.innerHTML = entryRowHtml(e);
  return row;
}

function wireDeleteButtons(container) {
  container.querySelectorAll(".del").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = Number(btn.dataset.id);
      const target = loadEntries().find(e => e.id === id);
      if (!target) return;
      const label = `${target.date} ${target.category} ${target.item || ""} ${fmtYen(target.price)}`.trim();
      if (!confirm(`この記録を削除しますか？\n${label}`)) return;
      saveEntries(loadEntries().filter(e => e.id !== id));
      renderAll();
      showToast("削除しました");
    });
  });
}

function renderToday() {
  const list = document.getElementById("today-list");
  const totalEl = document.getElementById("today-total");
  const todays = loadEntries()
    .filter(isRecordedToday)
    .sort((a, b) => b.id - a.id);

  totalEl.textContent = todays.length ? `${todays.length}件・${fmtYen(sumOf(todays))}` : "";

  list.innerHTML = "";
  if (todays.length === 0) {
    list.innerHTML = '<div class="empty-hint">今日はまだ記録がありません</div>';
    return;
  }
  todays.forEach(e => list.appendChild(makeEntryEl(e)));
  wireDeleteButtons(list);
}

function archiveEntries() {
  const entries = loadEntries();
  if (archiveFilter === "sent") {
    return entries.filter(e => e.exported);
  }
  return entries.filter(e => !e.exported);
}

function renderArchive() {
  const list = document.getElementById("archive-list");
  const totalEl = document.getElementById("archive-total");
  const rangeEl = document.getElementById("archive-range");
  const subtitleEl = document.getElementById("archive-subtitle");
  const clearBtn = document.getElementById("clear-sent-btn");

  const rows = archiveEntries();
  subtitleEl.textContent = archiveFilter === "sent" ? "送信済みの記録" : "未送信の記録";
  totalEl.textContent = rows.length ? `${rows.length}件・${fmtYen(sumOf(rows))}` : "";
  clearBtn.hidden = !(archiveFilter === "sent" && rows.length > 0);

  if (rows.length === 0) {
    rangeEl.textContent = "";
    list.innerHTML = archiveFilter === "sent"
      ? '<div class="empty-hint">送信済みの記録はありません</div>'
      : '<div class="empty-hint">未送信の記録はありません</div>';
    return;
  }

  const dates = rows.map(e => e.date).sort();
  rangeEl.textContent = dates[0] === dates[dates.length - 1]
    ? fmtDateLabel(dates[0])
    : `${fmtDateLabel(dates[0])} 〜 ${fmtDateLabel(dates[dates.length - 1])}`;

  list.innerHTML = "";

  if (sortMode === "recorded") {
    [...rows].sort((a, b) => b.id - a.id).forEach(e => list.appendChild(makeEntryEl(e)));
  } else {
    const groups = {};
    rows.forEach(e => {
      if (!groups[e.date]) groups[e.date] = [];
      groups[e.date].push(e);
    });
    Object.keys(groups).sort().reverse().forEach(date => {
      const group = document.createElement("div");
      group.className = "date-group";
      const head = document.createElement("div");
      head.className = "date-head";
      head.innerHTML = `<span>${fmtDateLabel(date, true)}</span><span>${fmtYen(sumOf(groups[date]))}</span>`;
      group.appendChild(head);
      groups[date].sort((a, b) => a.id - b.id).forEach(e => group.appendChild(makeEntryEl(e)));
      list.appendChild(group);
    });
  }

  wireDeleteButtons(list);
}

function renderExportSection() {
  const noteEl = document.getElementById("export-note");
  const btn = document.getElementById("export-btn");

  const pending = loadEntries().filter(e => !e.exported);

  btn.disabled = pending.length === 0;
  btn.innerHTML = pending.length
    ? `<span class="ico">📤</span>まとめて書き出す（${pending.length}件）`
    : `<span class="ico">📤</span>まとめて書き出す`;

  noteEl.textContent = pending.length === 0
    ? "書き出していない記録はありません。"
    : `上の未送信${pending.length}件（合計${fmtYen(sumOf(pending))}）をまとめて書き出します。`;
}

function renderArchiveButton() {
  const btn = document.getElementById("open-archive-btn");
  const pending = loadEntries().filter(e => !e.exported).length;
  btn.innerHTML = pending
    ? `<span class="ico">📋</span>ためた記録を見る・送る（${pending}件）`
    : `<span class="ico">📋</span>ためた記録を見る・送る`;
}

function loadShopping() {
  try {
    return JSON.parse(localStorage.getItem(SHOPPING_KEY)) || [];
  } catch (e) {
    return [];
  }
}

function saveShopping(items) {
  localStorage.setItem(SHOPPING_KEY, JSON.stringify(items));
}

function renderShopping() {
  const list = document.getElementById("shop-list");
  const countEl = document.getElementById("shop-count");
  const clearBtn = document.getElementById("shop-clear-btn");
  const items = loadShopping();
  const doneCount = items.filter(i => i.done).length;

  countEl.textContent = items.length ? `残り${items.length - doneCount}個` : "";
  clearBtn.hidden = doneCount === 0;
  clearBtn.innerHTML = `<span class="ico">🗑</span>買ったものを消す（${doneCount}個）`;

  list.innerHTML = "";
  if (items.length === 0) {
    list.innerHTML = '<div class="empty-hint">買うものを追加してください</div>';
    return;
  }

  items.forEach(item => {
    const row = document.createElement("div");
    row.className = "shop-item" + (item.done ? " done" : "");
    row.innerHTML = `
      <button class="check" data-id="${item.id}" aria-label="チェック">✓</button>
      <span class="shop-text" data-id="${item.id}">${item.text}</span>
      <button class="del" data-id="${item.id}" aria-label="削除">🗑</button>
    `;
    list.appendChild(row);
  });

  list.querySelectorAll(".check, .shop-text").forEach(el => {
    el.addEventListener("click", () => toggleShopItem(Number(el.dataset.id)));
  });
  list.querySelectorAll(".del").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = Number(btn.dataset.id);
      const target = loadShopping().find(i => i.id === id);
      if (!target) return;
      if (!confirm(`「${target.text}」をリストから消しますか？`)) return;
      saveShopping(loadShopping().filter(i => i.id !== id));
      renderShopping();
      renderShoppingButton();
    });
  });
}

function toggleShopItem(id) {
  saveShopping(loadShopping().map(i => i.id === id ? { ...i, done: !i.done } : i));
  renderShopping();
  renderShoppingButton();
}

function handleAddShopItem() {
  const input = document.getElementById("shop-input");
  const text = input.value.trim();
  if (!text) return;
  const items = loadShopping();
  items.push({ id: nextId(items.map(i => i.id)), text, done: false });
  saveShopping(items);
  input.value = "";
  input.focus();
  renderShopping();
  renderShoppingButton();
}

function handleClearDoneShopItems() {
  const done = loadShopping().filter(i => i.done);
  if (done.length === 0) return;
  if (!confirm(`買ったもの${done.length}個をリストから消します。よろしいですか？`)) return;
  saveShopping(loadShopping().filter(i => !i.done));
  renderShopping();
  renderShoppingButton();
  showToast("消しました");
}

function renderShoppingButton() {
  const btn = document.getElementById("open-shopping-btn");
  const remaining = loadShopping().filter(i => !i.done).length;
  btn.innerHTML = remaining
    ? `<span class="ico">🛒</span>買い物リスト（残り${remaining}個）`
    : `<span class="ico">🛒</span>買い物リスト`;
}

function renderAll() {
  renderToday();
  renderArchive();
  renderExportSection();
  renderArchiveButton();
  renderShopping();
  renderShoppingButton();
}

const THEME_META = { light: "#f5f5f3", dark: "#14181d" };
// ボタンを押すたびに この順で巡回する
const THEME_CYCLE = ["system", "light", "dark"];
const THEME_UI = {
  system: { icon: "🌗", label: "システム設定に連動" },
  light: { icon: "☀️", label: "ライト" },
  dark: { icon: "🌙", label: "ダーク" }
};

// 設定値から実際に適用するテーマを決める（system は端末の設定で決まる）
function resolvedTheme(pref) {
  return pref === "system" ? (systemPrefersDark() ? "dark" : "light") : pref;
}

// data-theme属性・ボタン表示・ステータスバー色を反映（persist=trueで選択を保存）
function applyTheme(pref, persist) {
  const dark = resolvedTheme(pref) === "dark";
  if (dark) document.documentElement.setAttribute("data-theme", "dark");
  else document.documentElement.removeAttribute("data-theme");

  const btn = document.getElementById("theme-btn");
  // 3状態のため「切替先」ではなく「現在の状態」をアイコンで示す
  if (btn) {
    const nextPref = THEME_CYCLE[(THEME_CYCLE.indexOf(pref) + 1) % THEME_CYCLE.length];
    const desc = `画面表示：${THEME_UI[pref].label}（タップで「${THEME_UI[nextPref].label}」へ）`;
    btn.textContent = THEME_UI[pref].icon;
    btn.setAttribute("aria-label", desc);
    btn.setAttribute("title", desc);
  }

  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", THEME_META[dark ? "dark" : "light"]);
  const bar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
  if (bar) bar.setAttribute("content", dark ? "black-translucent" : "default");

  if (persist) { try { localStorage.setItem(THEME_KEY, pref); } catch (e) {} }
}

function toggleTheme() {
  const next = THEME_CYCLE[(THEME_CYCLE.indexOf(themePref()) + 1) % THEME_CYCLE.length];
  applyTheme(next, true);
  showToast(`画面表示：${THEME_UI[next].label}`);
}

function initTheme() {
  applyTheme(themePref(), false); // head側で決まった状態にUIを合わせる
  // 「システム設定に連動」の間は端末の設定変更に追従する
  if (window.matchMedia) {
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const onChange = () => { if (themePref() === "system") applyTheme("system", false); };
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }
}

const VIEW_TITLES = {
  main: "家計簿を記録",
  archive: "ためた記録",
  shopping: "買い物リスト"
};

function showView(view) {
  document.getElementById("main-view").hidden = view !== "main";
  document.getElementById("archive-view").hidden = view !== "archive";
  document.getElementById("shopping-view").hidden = view !== "shopping";
  document.getElementById("page-title").textContent = VIEW_TITLES[view];
  window.scrollTo(0, 0);
}

function resetForm() {
  document.getElementById("amount-input").value = "";
  document.getElementById("item-input").value = "";
  selectedCategory = null;
  document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("selected"));
}

function handleSubmit() {
  const date = document.getElementById("date-input").value || todayStr();
  const amount = Number(document.getElementById("amount-input").value);
  const item = document.getElementById("item-input").value.trim();

  if (!selectedCategory) {
    showToast("区分を選んでください");
    return;
  }
  if (!amount || amount <= 0) {
    showToast("金額を入力してください");
    return;
  }

  const entries = loadEntries();
  entries.push({
    id: nextId(entries.map(e => e.id)),
    date,
    category: selectedCategory,
    item,
    price: amount,
    exported: false
  });
  saveEntries(entries);
  resetForm();
  renderAll();
  showToast("記録しました");
}

function csvEscape(v) {
  const s = String(v ?? "");
  if (/[",\n]/.test(s)) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function buildCsv(entries) {
  const lines = entries.map(e =>
    [e.date, e.category, e.item, e.price].map(csvEscape).join(",")
  );
  return lines.join("\n") + "\n";
}

async function handleExport() {
  const pending = loadEntries().filter(e => !e.exported);
  if (pending.length === 0) return;

  const csv = buildCsv(pending);
  const filename = `kakeibo_${Date.now()}.csv`;
  const file = new File([csv], filename, { type: "text/csv" });

  let shared = false;
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: "家計簿データ" });
      shared = true;
    } catch (err) {
      if (err.name === "AbortError") return;
    }
  }

  if (!shared) {
    const url = URL.createObjectURL(file);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    shared = true;
  }

  if (shared) {
    const ids = new Set(pending.map(e => e.id));
    saveEntries(loadEntries().map(e => ids.has(e.id) ? { ...e, exported: true } : e));
    renderAll();
    showToast(`${pending.length}件を書き出しました`);
  }
}

function handleClearSent() {
  const sent = loadEntries().filter(e => e.exported);
  if (sent.length === 0) return;
  if (!confirm(`送信済みの記録${sent.length}件をすべて削除します。よろしいですか？`)) return;
  saveEntries(loadEntries().filter(e => !e.exported));
  renderAll();
  showToast("送信済みを削除しました");
}

}
