<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家計簿入力</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="家計簿">
<meta name="theme-color" content="#4a7ba6">
<style>
  :root {
    --blue: #4a7ba6;
    --blue-light: #e6f1fb;
    --text: #1c1c1c;
    --text-muted: #6b6b6b;
    --border: #dcdcdc;
    --bg: #f5f5f3;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 2rem;
  }
  header {
    padding: 1rem 1.25rem 0.5rem;
    text-align: center;
  }
  header h1 {
    font-size: 17px;
    font-weight: 600;
    margin: 0;
  }
  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 0.5rem 1rem 1.5rem;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    border: 1px solid var(--border);
    padding: 1.1rem 1rem;
    margin-bottom: 1rem;
  }
  .field-label {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
    display: block;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1rem;
  }
  .row:last-child { margin-bottom: 0; }
  input[type="date"], input[type="number"], input[type="text"] {
    font-size: 16px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fafafa;
    width: 100%;
  }
  .amount-wrap {
    text-align: center;
    margin-bottom: 1.1rem;
  }
  .amount-wrap input {
    font-size: 34px;
    font-weight: 600;
    text-align: center;
    border: none;
    background: transparent;
    width: 100%;
    padding: 0;
  }
  .amount-wrap input:focus { outline: none; }
  .cat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 1.1rem;
  }
  .cat-btn {
    font-size: 14px;
    padding: 10px 6px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fafafa;
    color: var(--text);
  }
  .cat-btn.selected {
    background: var(--blue-light);
    border-color: var(--blue);
    color: var(--blue);
    font-weight: 600;
  }
  .item-wrap { margin-bottom: 1.2rem; }
  .submit-btn {
    width: 100%;
    height: 48px;
    border: none;
    border-radius: 10px;
    background: var(--blue);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
  }
  .submit-btn:active { opacity: 0.85; }
  .list-title {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .list-title span:first-child { font-size: 14px; font-weight: 600; }
  .list-title span:last-child { font-size: 13px; color: var(--text-muted); }
  .sort-toggle {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }
  .sort-btn {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: #fafafa;
    color: var(--text-muted);
  }
  .sort-btn.selected {
    background: var(--blue-light);
    border-color: var(--blue);
    color: var(--blue);
    font-weight: 600;
  }
  .entry {
    display: flex;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    gap: 8px;
  }
  .entry:last-child { border-bottom: none; }
  .entry .cat {
    font-size: 11px;
    color: var(--blue);
    background: var(--blue-light);
    border-radius: 6px;
    padding: 2px 6px;
    white-space: nowrap;
  }
  .entry .item { flex: 1; color: var(--text); }
  .entry .price { font-weight: 600; white-space: nowrap; }
  .entry .del {
    color: var(--danger);
    background: none;
    border: none;
    font-size: 18px;
    padding: 0 4px;
    line-height: 1;
  }
  .entry.exported { opacity: 0.45; }
  .empty-hint {
    color: var(--text-muted);
    font-size: 13px;
    text-align: center;
    padding: 1rem 0;
  }
  .export-btn {
    width: 100%;
    height: 46px;
    border: none;
    border-radius: 10px;
    background: #fff;
    border: 1px solid var(--blue);
    color: var(--blue);
    font-size: 15px;
    font-weight: 600;
    margin-top: 0.5rem;
  }
  .export-btn:disabled {
    opacity: 0.4;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: var(--text);
    color: #fff;
    padding: 10px 18px;
    border-radius: 20px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.25s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>家計簿を記録</h1>
</header>

<main>
  <div class="card">
    <div class="row">
      <span class="field-label" style="margin:0;">日付</span>
      <input type="date" id="date-input" style="width:auto;">
    </div>

    <div class="amount-wrap">
      <span class="field-label">金額</span>
      <input type="number" id="amount-input" inputmode="numeric" placeholder="0" min="0">
    </div>

    <span class="field-label">区分</span>
    <div class="cat-grid" id="cat-grid"></div>

    <div class="item-wrap">
      <span class="field-label">品名</span>
      <input type="text" id="item-input" placeholder="スーパーで買い物">
    </div>

    <button class="submit-btn" id="submit-btn">記録する</button>
  </div>

  <div class="card">
    <div class="list-title">
      <span>まだ送っていない記録</span>
      <span id="pending-total"></span>
    </div>
    <div class="sort-toggle" id="sort-toggle">
      <button type="button" class="sort-btn selected" data-mode="recorded">記録順</button>
      <button type="button" class="sort-btn" data-mode="date">日付順</button>
    </div>
    <div id="entry-list"></div>
    <button class="export-btn" id="export-btn" disabled>この内容を書き出す</button>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const CATEGORIES = [
  "食費", "住居・備品", "水道・光熱", "衣料", "交際費",
  "レジャー", "教育", "医療・衛生", "その他1", "その他2"
];

const STORAGE_KEY = "kakeibo_entries_v1";
let selectedCategory = null;
let sortMode = "recorded";

function todayStr() {
  const d = new Date();
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}

function loadEntries() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch (e) {
    return [];
  }
}

function saveEntries(entries) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 1800);
}

function renderCategories() {
  const grid = document.getElementById("cat-grid");
  grid.innerHTML = "";
  CATEGORIES.forEach(cat => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "cat-btn";
    btn.textContent = cat;
    btn.dataset.cat = cat;
    btn.addEventListener("click", () => {
      selectedCategory = cat;
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
    });
    grid.appendChild(btn);
  });
}

function fmtYen(n) {
  return "¥" + Math.round(n).toLocaleString("ja-JP");
}

function renderEntries() {
  const entries = loadEntries();
  const list = document.getElementById("entry-list");
  const exportBtn = document.getElementById("export-btn");
  const pendingTotalEl = document.getElementById("pending-total");

  const pending = entries.filter(e => !e.exported);
  const pendingTotal = pending.reduce((s, e) => s + e.price, 0);
  pendingTotalEl.textContent = pending.length ? fmtYen(pendingTotal) : "";

  const recent = [...entries].sort((a, b) => {
    if (sortMode === "date") {
      const dateDiff = b.date.localeCompare(a.date);
      if (dateDiff !== 0) return dateDiff;
    }
    return b.id - a.id;
  }).slice(0, 20);

  if (recent.length === 0) {
    list.innerHTML = '<div class="empty-hint">まだ記録がありません</div>';
  } else {
    list.innerHTML = "";
    recent.forEach(e => {
      const row = document.createElement("div");
      row.className = "entry" + (e.exported ? " exported" : "");
      row.innerHTML = `
        <span class="cat">${e.category}</span>
        <span class="item">${e.item || ""} <span style="color:var(--text-muted)">${e.date.slice(5)}</span></span>
        <span class="price">${fmtYen(e.price)}</span>
        <button class="del" data-id="${e.id}" aria-label="削除">&times;</button>
      `;
      list.appendChild(row);
    });
    list.querySelectorAll(".del").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = Number(btn.dataset.id);
        const target = loadEntries().find(e => e.id === id);
        if (!target) return;
        const label = `${target.date} ${target.category} ${target.item || ""} ${fmtYen(target.price)}`.trim();
        if (!confirm(`この記録を削除しますか？\n${label}`)) return;
        const next = loadEntries().filter(e => e.id !== id);
        saveEntries(next);
        renderEntries();
      });
    });
  }

  exportBtn.disabled = pending.length === 0;
}

function resetForm() {
  document.getElementById("amount-input").value = "";
  document.getElementById("item-input").value = "";
  selectedCategory = null;
  document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("selected"));
}

function handleSubmit() {
  const date = document.getElementById("date-input").value || todayStr();
  const amount = Number(document.getElementById("amount-input").value);
  const item = document.getElementById("item-input").value.trim();

  if (!selectedCategory) {
    showToast("区分を選んでください");
    return;
  }
  if (!amount || amount <= 0) {
    showToast("金額を入力してください");
    return;
  }

  const entries = loadEntries();
  entries.push({
    id: Date.now(),
    date,
    category: selectedCategory,
    item,
    price: amount,
    exported: false
  });
  saveEntries(entries);
  resetForm();
  renderEntries();
  showToast("記録しました");
}

function csvEscape(v) {
  const s = String(v ?? "");
  if (/[",\n]/.test(s)) {
    return '"' + s.replace(/"/g, '""') + '"';
  }
  return s;
}

function buildCsv(entries) {
  const lines = entries.map(e =>
    [e.date, e.category, e.item, e.price].map(csvEscape).join(",")
  );
  return lines.join("\n") + "\n";
}

async function handleExport() {
  const entries = loadEntries();
  const pending = entries.filter(e => !e.exported);
  if (pending.length === 0) return;

  const csv = buildCsv(pending);
  const filename = `kakeibo_${Date.now()}.csv`;
  const file = new File([csv], filename, { type: "text/csv" });

  let shared = false;
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: "家計簿データ" });
      shared = true;
    } catch (err) {
      if (err.name === "AbortError") return;
    }
  }

  if (!shared) {
    const url = URL.createObjectURL(file);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    shared = true;
  }

  if (shared) {
    const ids = new Set(pending.map(e => e.id));
    const next = loadEntries().map(e => ids.has(e.id) ? { ...e, exported: true } : e);
    saveEntries(next);
    renderEntries();
    showToast("書き出しました");
  }
}

document.getElementById("date-input").value = todayStr();
renderCategories();
renderEntries();
document.getElementById("submit-btn").addEventListener("click", handleSubmit);
document.getElementById("export-btn").addEventListener("click", handleExport);
document.querySelectorAll(".sort-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    sortMode = btn.dataset.mode;
    document.querySelectorAll(".sort-btn").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    renderEntries();
  });
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>

</body>
</html>
